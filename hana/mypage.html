<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>マイページ</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="mypage.css">
</head>

<body>

    <div class="container">

        <!-- ホームに戻る -->
        <button
            type="button"
            class="back-btn"
            onclick="location.href='../hada/home.html'"
        >
            戻る
        </button>

        <h1>マイページ</h1>

        <p class="description">
            登録している情報を確認できます
        </p>


        <!-- 登録情報 -->
        <section class="profile-card">

            <h2>登録情報</h2>


            <!-- 名前 -->
            <div class="info-item">

                <div class="info-label">
                    名前
                </div>

                <div
                    id="userName"
                    class="info-value"
                >
                    読み込み中...
                </div>

            </div>


            <!-- メールアドレス -->
            <div class="info-item">

                <div class="info-label">
                    メールアドレス
                </div>

                <div
                    id="userEmail"
                    class="info-value email-value"
                >
                    読み込み中...
                </div>

            </div>

        </section>


        <!-- 変更ボタン -->
        <button
            type="button"
            id="editBtn"
            class="main-btn"
        >
            登録情報を変更する
        </button>

    </div>



    <!-- =====================================
         編集モーダル
    ====================================== -->

    <div
        id="editModal"
        class="modal"
        hidden
    >

        <div class="modal-box">

            <h2>登録情報の変更</h2>

            <p class="modal-description">
                変更したい内容を入力してください。
            </p>


            <!-- 名前 -->
            <label for="editName">
                名前
            </label>

            <input
                type="text"
                id="editName"
                placeholder="名前を入力してください"
            >


            <!-- メール -->
            <label for="editEmail">
                メールアドレス
            </label>

            <input
                type="email"
                id="editEmail"
                placeholder="メールアドレスを入力してください"
            >


            <!-- メールアドレス変更時のみ使用 -->
            <div
                id="passwordArea"
                class="password-area"
                hidden
            >

                <label for="currentPassword">
                    現在のパスワード
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="現在のパスワードを入力してください"
                >

                <p class="small-note">
                    メールアドレスを変更する場合は、
                    本人確認のため現在のパスワードが必要です。
                </p>

            </div>


            <div class="modal-buttons">

                <button
                    type="button"
                    id="editCancel"
                    class="cancel-btn"
                >
                    キャンセル
                </button>

                <button
                    type="button"
                    id="editNext"
                    class="confirm-btn"
                >
                    次へ
                </button>

            </div>

        </div>

    </div>



    <!-- =====================================
         変更確認モーダル
    ====================================== -->

    <div
        id="confirmModal"
        class="modal"
        hidden
    >

        <div class="modal-box">

            <h2>変更内容の確認</h2>

            <p class="modal-description">
                以下の内容に変更します。
            </p>


            <div class="confirm-info">

                <div class="confirm-row">

                    <span>名前</span>

                    <strong id="confirmName">
                    </strong>

                </div>


                <div class="confirm-row">

                    <span>メールアドレス</span>

                    <strong id="confirmEmail">
                    </strong>

                </div>

            </div>


            <p class="question">
                この内容で変更しますか？
            </p>


            <div class="modal-buttons">

                <button
                    type="button"
                    id="confirmCancel"
                    class="cancel-btn"
                >
                    戻る
                </button>

                <button
                    type="button"
                    id="confirmSave"
                    class="confirm-btn"
                >
                    変更する
                </button>

            </div>

        </div>

    </div>



    <!-- =====================================
         完了モーダル
    ====================================== -->

    <div
        id="completeModal"
        class="modal"
        hidden
    >

        <div class="modal-box complete-box">

            <div class="complete-icon">
                ✓
            </div>

            <h2>変更完了</h2>

            <p>
                登録情報を変更しました。
            </p>

            <button
                type="button"
                id="completeOk"
                class="confirm-btn"
            >
                OK
            </button>

        </div>

    </div>



    <!-- =====================================
         エラーモーダル
    ====================================== -->

    <div
        id="errorModal"
        class="modal"
        hidden
    >

        <div class="modal-box">

            <h2>確認してください</h2>

            <p
                id="errorMessage"
                class="error-message"
            >
            </p>

            <button
                type="button"
                id="errorOk"
                class="confirm-btn"
            >
                OK
            </button>

        </div>

    </div>



    <script
        type="module"
        src="mypage.js"
    ></script>

</body>

</html>
