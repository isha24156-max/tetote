<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>退会</title>

    <link rel="stylesheet" href="taikai.css?v=4">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- 退会画面 -->
    <div class="taikai-container">

        <h1>退会</h1>

        <p>
            退会すると、登録した<br>
            連絡先とアカウントが削除されます。
        </p>

        <button type="button" id="taikaiBtn" class="taikai-btn">
            退会する
        </button>

        <button
            type="button"
            class="cancel-btn"
            onclick="location.href='../hada/home.html'"
        >
            キャンセル
        </button>

    </div>


    <!-- 退会確認モーダル -->
    <div id="confirmModal" class="modal">

        <div class="modal-box">

            <p>本当に退会しますか？</p>

            <div class="modal-buttons">

                <button type="button" id="cancelBtn">
                    いいえ
                </button>

                <button type="button" id="confirmBtn">
                    はい
                </button>

            </div>

        </div>

    </div>


    <!-- パスワード入力モーダル -->
    <div id="passwordModal" class="modal">

        <div class="modal-box">

            <p>
                退会するには<br>
                パスワードを入力してください。
            </p>

            <!-- パスワード入力欄と目のアイコン -->
            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="パスワード"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="toggle-password"
                    aria-label="パスワードを表示"
                >
                    <img
                        id="passwordEye"
                        src="../hana/img/eye2.png"
                        alt=""
                    >
                </button>

            </div>

            <!-- エラーメッセージ -->
            <p
                id="passwordError"
                class="password-error"
                role="alert"
                aria-live="polite"
            ></p>

            <!-- 操作ボタン -->
            <div class="modal-buttons">

                <button type="button" id="passwordCancelBtn">
                    キャンセル
                </button>

                <button type="button" id="deleteAccountBtn">
                    退会する
                </button>

            </div>

        </div>

    </div>


    <!-- 退会完了モーダル -->
    <div id="completeModal" class="modal">

        <div class="modal-box complete-box">

            <div class="complete-icon">
                ✓
            </div>

            <h2>退会が完了しました</h2>

            <p>
                アカウントと登録した<br>
                連絡先を削除しました。
            </p>

            <button type="button" id="loginPageBtn">
                ログイン画面へ
            </button>

        </div>

    </div>


    <script type="module" src="taikai.js?v=5"></script>

</body>

</html>
