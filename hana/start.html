
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>てとて</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="title">
            <span class="green">て</span><span class="orange small">と</span><span class="block">て</span>
        </h1>

        <button onclick="location.href='../morita/consent.html'">
            スタート
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6stEZ00HAtMNEuUzG47zIUArCFJgsfTA",
            authDomain: "tetote-f459b.firebaseapp.com",
            projectId: "tetote-f459b",
            storageBucket: "tetote-f459b.firebasestorage.app",
            messagingSenderId: "4402684573",
            appId: "1:4402684573:web:09529c707357ce437dea74",
            measurementId: "G-CSGLSRBLDR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function recordStartPage() {
            try {
                const result = await signInAnonymously(auth);

                await addDoc(collection(db, "usage_logs"), {
                    userId: result.user.uid,
                    screen: "スタート画面",
                    type: "page_view",
                    timestamp: serverTimestamp()
                });

                console.log("スタート画面の閲覧記録を保存しました");
            } catch (error) {
                console.error("スタート画面の閲覧記録に失敗しました:", error);
            }
        }

        recordStartPage();
    </script>
</body>
</html>
