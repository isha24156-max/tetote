<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>新規登録</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="register.css">
</head>

<body>

<div class="container">

  <h1>新規登録</h1>

  <p>アカウントを作成してください</p>

  <input
    type="text"
    id="name"
    placeholder="名前"
  >

  <input
    type="email"
    id="email"
    placeholder="メールアドレス"
  >

  <div class="password-area">

  <input
    type="password"
    id="password"
    placeholder="パスワード（6文字以上）"
  >

  <button
    type="button"
    id="togglePassword"
    aria-label="パスワードを表示"
     onclick="togglePasswordVisibility()"
  >
    <span class="eye"></span>
  </button>

</div>

  
  <button class="menu-btn safety-btn" id="registerBtn">
    登録する
  </button>

  <button class="menu-btn back-btn" onclick="location.href='login.html'">
    ログイン画面へ
  </button>

</div>


  <!-- =========================
     画面中央に表示するメッセージ
     ========================= -->

<div id="messageModal" class="message-modal" hidden>

  <div class="message-box">

    <p id="messageText"></p>

    <button type="button" id="messageOk">
      OK
    </button>

  </div>

</div>


<script type="module">

// =====================================
// Firebase
// =====================================

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


// =====================================
// Firebase設定
// =====================================

const firebaseConfig = {

  apiKey:
    "AIzaSyA6stEZ00HAtMNEvUzG47zIUArCFJgsfTA",

  authDomain:
    "tetote-f459b.firebaseapp.com",

  projectId:
    "tetote-f459b",

  storageBucket:
    "tetote-f459b.firebasestorage.app",

  messagingSenderId:
    "4402684573",

  appId:
    "1:4402684573:web:09529c707357ce437dea74",

  measurementId:
    "G-CSGLSRBLDR"

};


// =====================================
// Firebaseを初期化
// =====================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// =====================================
// メッセージ表示
// =====================================

function showMessage(message, callback) {

  const modal =
    document.getElementById("messageModal");

  const messageText =
    document.getElementById("messageText");

  const messageOk =
    document.getElementById("messageOk");


  messageText.textContent = message;

  modal.hidden = false;


  messageOk.onclick = () => {

    modal.hidden = true;

    if (callback) {
      callback();
    }

  };

}


// =====================================
// 新規登録
// =====================================

document
  .getElementById("registerBtn")
  .addEventListener("click", async () => {


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    // =================================
    // 未入力チェック
    // =================================

    if (!name || !email || !password) {

      showMessage(
        "すべて入力してください。"
      );

      return;

    }


    // =================================
    // パスワード文字数チェック
    // =================================

    if (password.length < 6) {

      showMessage(
        "パスワードは6文字以上にしてください。"
      );

      return;

    }


    try {

      // =================================
      // Firebase Authenticationに登録
      // =================================

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      // この人専用のUID
      const uid =
        userCredential.user.uid;


      // =================================
      // Firestoreに名前とメールアドレスを保存
      // =================================

      await setDoc(
        doc(db, "users", uid),
        {
          name: name,
          email: email,
          createdAt: Date.now()
        }
      );


      // =================================
      // 登録成功
      // =================================

      showMessage(
        "登録しました！",
        () => {

          // OKを押したら連絡先登録画面へ
          location.href = "../hana/mail.html";

        }
      );


    } catch (error) {

      console.error(
        "登録エラー:",
        error
      );


      // =================================
      // 登録失敗
      // =================================

      showMessage(
        "登録に失敗しました。\n\nエラー：" +
        error.code
      );

    }

  });

</script>

  <script>
  function togglePasswordVisibility() {

  const passwordInput =
    document.getElementById("password");

  const togglePassword =
    document.getElementById("togglePassword");

  if (passwordInput.type === "password") {

    passwordInput.type = "text";

    togglePassword.classList.add("show");

    togglePassword.setAttribute(
      "aria-label",
      "パスワードを非表示"
    );

  } else {

    passwordInput.type = "password";

    togglePassword.classList.remove("show");

    togglePassword.setAttribute(
      "aria-label",
      "パスワードを表示"
    );

  }
}
</script>
  
</body>
</html>
