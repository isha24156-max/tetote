<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ログイン</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap"
    rel="stylesheet"
  >


  <link rel="stylesheet" href="login.css">

</head>


<body>


<div class="container">


  <h1>ログイン</h1>


  <p>
    メールアドレスとパスワードを入力してください
  </p>


  <!-- メールアドレス -->

  <input
    type="email"
    id="email"
    placeholder="メールアドレス"
  >


  <!-- パスワード -->

  <div class="password-area">

    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >


    <!-- 目のボタン -->

    <button
      type="button"
      id="togglePassword"
      aria-label="パスワードを表示"
    >

      <span class="eye"></span>

    </button>

  </div>


  <!-- ログインボタン -->

  <button
    class="menu-btn safety-btn"
    id="loginBtn"
  >
    ログイン
  </button>


  <p>
    アカウントを持っていない方
  </p>


  <!-- 新規登録 -->

  <button
    class="menu-btn back-btn"
    onclick="location.href='register.html'"
  >
    新規登録
  </button>


</div>

<!-- 画面中央に表示するメッセージ -->
<div id="messageModal" class="message-modal" hidden>
  <div class="message-box">
    <p id="messageText"></p>
    <button type="button" id="messageOk">OK</button>
  </div>
</div>



</body>

</html>
