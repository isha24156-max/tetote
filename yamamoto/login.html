<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ログイン</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap"
    rel="stylesheet"
  >


  <link rel="stylesheet" href="login.css">

</head>


<body>


<div class="container">


  <h1>ログイン</h1>


  <p>
    メールアドレスとパスワードを入力してください
  </p>


  <!-- メールアドレス -->

  <input
    type="email"
    id="email"
    placeholder="メールアドレス"
  >


  <!-- パスワード -->

  <div class="password-area">

    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >


    <!-- 目のボタン -->

    <button
      type="button"
      id="togglePassword"
      aria-label="パスワードを表示"
    >

      <span class="eye"></span>

    </button>

  </div>


  <!-- ログインボタン -->

  <button
    class="menu-btn safety-btn"
    id="loginBtn"
  >
    ログイン
  </button>


  <p>
    アカウントを持っていない方
  </p>


  <!-- 新規登録 -->

  <button
    class="menu-btn back-btn"
    onclick="location.href='register.html'"
  >
    新規登録
  </button>


</div>

<!-- 画面中央に表示するメッセージ -->
<div id="messageModal" class="message-modal" hidden>
  <div class="message-box">
    <p id="messageText"></p>
    <button type="button" id="messageOk">OK</button>
  </div>
</div>

<script type="module">


// =====================================
// Firebase
// =====================================

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";



const firebaseConfig = {

  apiKey:
    "AIzaSyA6stEZ00HAtMNEvUzG47zIUArCFJgsfTA",

  authDomain:
    "tetote-f459b.firebaseapp.com",

  projectId:
    "tetote-f459b",

  storageBucket:
    "tetote-f459b.firebasestorage.app",

  messagingSenderId:
    "4402684573",

  appId:
    "1:4402684573:web:09529c707357ce437dea74",

  measurementId:
    "G-CSGLSRBLDR"

};



const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);



// =====================================
// パスワード表示・非表示
// =====================================

const passwordInput =
  document.getElementById("password");


const togglePassword =
  document.getElementById("togglePassword");



togglePassword.addEventListener("click", () => {


  // パスワードが隠れている場合

  if (passwordInput.type === "password") {

    // パスワードを表示

    passwordInput.type = "text";


    // 目を少し変える

    togglePassword.classList.add("show");


    togglePassword.setAttribute(
      "aria-label",
      "パスワードを非表示"
    );


  } else {


    // パスワードを隠す

    passwordInput.type = "password";


    togglePassword.classList.remove("show");


    togglePassword.setAttribute(
      "aria-label",
      "パスワードを表示"
    );

  }

});



// =====================================
// ログイン
// =====================================

document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;



    // 未入力チェック

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;

    }



    try {


      // Firebase Authenticationでログイン

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );



      alert("ログインしました！");



      // 家族登録画面へ

      location.href =
        "../hana/mail.html";



    } catch (error) {


      console.error(error);



      if (

        error.code ===
          "auth/invalid-credential"

        ||

        error.code ===
          "auth/wrong-password"

        ||

        error.code ===
          "auth/user-not-found"

      ) {


        alert(
          "メールアドレスまたはパスワードが違います。"
        );


      } else {


        alert(
          "ログインに失敗しました。"
        );

      }

    }

  });


</script>


</body>

</html>
