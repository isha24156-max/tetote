    <!-- =========================
         本メニューの動き
         ========================= -->

    <script>

        const bookBtn =
            document.getElementById("bookBtn");

        const bookMenu =
            document.getElementById("bookMenu");

        const bookMenuList =
            document.getElementById("bookMenuList");


        /*
         * スマホ用
         * 本のボタンをタップすると開く
         */

        bookBtn.addEventListener("click", (event) => {

            event.stopPropagation();

            bookMenuList.classList.toggle("show");

        });


        /*
         * メニューの中を押したときは
         * 閉じる処理を邪魔しない
         */

        bookMenuList.addEventListener("click", (event) => {

            event.stopPropagation();

        });


        /*
         * 本のボタン以外を押したら閉じる
         */

        document.addEventListener("click", () => {

            bookMenuList.classList.remove("show");

        });

    </script>

        <script>
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register("../service-worker.js")

                    .then(() => {
                        console.log("オフライン対応を有効にしました");
                    })

                    .catch((error) => {
                        console.error(
                            "Service Worker登録エラー:",
                            error
                        );
                    });

            });

        }
    </script>


    <script src="script.js"></script>

   <script type="module">
    console.log("ホーム画面のFirebase処理開始");

    console.log("ホームのURL:", location.href);
    console.log("ホームのオリジン:", location.origin);

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        setPersistence,
        browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

    import { getFirestore }
        from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    import { recordPageView }
        from "../log.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA6stEZ00AtHAtMNEuUzG47ZiuArCFJgsfTA",
        authDomain: "tetote-f459b.firebaseapp.com",
        projectId: "tetote-f459b",
        storageBucket: "tetote-f459b.firebasestorage.app",
        messagingSenderId: "4402684573",
        appId: "1:4402684573:web:09529c707357ce437dea74",
        measurementId: "G-CSGLSRBLDR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // ログイン状態の保存方法をほかの画面と統一
    await setPersistence(auth, browserLocalPersistence);
    
    // 認証状態の復元を待つ
    await auth.authStateReady();

    console.log(
        "認証状態の復元後:",
        auth.currentUser ? auth.currentUser.uid : "ユーザーなし"
    );

    console.log("Auth persistence:", auth);
    console.log("現在のユーザー:", auth.currentUser);

    let pageViewRecorded = false;

    onAuthStateChanged(auth, async (user) => {

        console.log(
            "ホーム画面のログイン状態:",
            user ? user.uid : "ユーザーなし"
        );

        if (user) {

            if (!pageViewRecorded) {
                pageViewRecorded = true;
                await recordPageView(db, user, "ホーム画面");
            }

        } else {

            console.log("ログインユーザーを取得できませんでした");

            // 原因調査のため、今は自動でログイン画面に戻さない
        }

    });
</script>
