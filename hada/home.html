<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>home</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =========================
         右上の本メニュー
         ========================= -->

    <div class="book-menu" id="bookMenu">

      <button
    type="button"
    id="bookBtn"
    class="book-btn"
    aria-label="メニューを開く"
>
    <span></span>
    <span></span>
    <span></span>
</button>

        <!-- メニュー -->

        <div
            id="bookMenuList"
            class="book-menu-list"
        >

            <button
                type="button"
                onclick="location.href='mypage.html'"
            >
                👤 マイページ
            </button>


            <button
    type="button"
    onclick="location.href='../hana/tutorial.html?from=menu'">
    📖 アプリ説明
</button>

        </div>

    </div>



    <!-- =========================
         ホーム画面
         ========================= -->

    <div class="container">

        <h1>
            ご利用になりたいボタンを押してください
        </h1>


        <a href="../morita/checklist.html">

            <button class="menu-btn">
                持ち物チェック
            </button>

        </a>


        <button
            class="menu-btn"
            onclick="location.href='../yamamoto/anpi.html'"
        >
            安否確認
        </button>


        <button
            class="menu-btn"
            onclick="location.href='contact-list.html'"
        >
            連絡先一覧
        </button>


        <button
            class="menu-btn"
            onclick="location.href='../morita/profile.html'"
        >
            連絡先登録
        </button>

    </div>



    <!-- =========================
         本メニューの動き
         ========================= -->

    <script>

        const bookBtn =
            document.getElementById("bookBtn");

        const bookMenu =
            document.getElementById("bookMenu");

        const bookMenuList =
            document.getElementById("bookMenuList");


        /*
         * スマホ用
         * 本のボタンをタップすると開く
         */

        bookBtn.addEventListener("click", (event) => {

            event.stopPropagation();

            bookMenuList.classList.toggle("show");

        });


        /*
         * メニューの中を押したときは
         * 閉じる処理を邪魔しない
         */

        bookMenuList.addEventListener("click", (event) => {

            event.stopPropagation();

        });


        /*
         * 本のボタン以外を押したら閉じる
         */

        document.addEventListener("click", () => {

            bookMenuList.classList.remove("show");

        });

    </script>


    <script src="script.js"></script>

</body>

</html>
